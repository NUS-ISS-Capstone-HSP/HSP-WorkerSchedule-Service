name: CI

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  lint_and_unit_test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Lint
        run: |
          ruff check .
          mypy hsp_worker_schedule_service

      - name: Unit test
        run: pytest tests/unit -q

  coverage_and_security:
    runs-on: ubuntu-latest
    needs: lint_and_unit_test
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Coverage
        run: pytest --cov=hsp_worker_schedule_service --cov-report=term-missing --cov-fail-under=70 -q

      - name: Security scan - bandit
        continue-on-error: true
        run: bandit -q -r hsp_worker_schedule_service

      - name: Security scan - pip-audit
        continue-on-error: true
        run: pip-audit

      - name: Security scan - trivy
        continue-on-error: true
        uses: aquasecurity/trivy-action@0.35.0
        with:
          scan-type: fs
          scan-ref: .
          severity: HIGH,CRITICAL
          format: table
          exit-code: "1"

  build_and_scan_image:
    runs-on: ubuntu-latest
    needs: coverage_and_security
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build docker image
        run: |
          REPO_NAME="${GITHUB_REPOSITORY##*/}"
          REPO_NAME="${REPO_NAME,,}"
          IMAGE_NAME="local/${REPO_NAME}:${GITHUB_SHA}"
          docker build -t "${IMAGE_NAME}" .
          docker save "${IMAGE_NAME}" -o /tmp/local-image.tar

      - name: Upload image artifact
        uses: actions/upload-artifact@v4
        with:
          name: local-image-${{ github.sha }}
          path: /tmp/local-image.tar
          if-no-files-found: error
          retention-days: 1

  push_image:
    runs-on: ubuntu-latest
    needs: build_and_scan_image
    if: github.ref == 'refs/heads/main'
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download image artifact
        uses: actions/download-artifact@v4
        with:
          name: local-image-${{ github.sha }}
          path: /tmp

      - name: Load docker image
        run: docker load -i /tmp/local-image.tar

      - name: Login to Aliyun registry
        run: |
          echo "${{ secrets.ALIYUN_PASSWORD }}" | docker login "${{ secrets.ALIYUN_REGISTRY }}" \
            --username "${{ secrets.ALIYUN_USERNAME }}" \
            --password-stdin

      - name: Push docker image to Aliyun
        run: |
          REPO_NAME="${GITHUB_REPOSITORY##*/}"
          REPO_NAME="${REPO_NAME,,}"

          LOCAL_IMAGE="local/${REPO_NAME}:${GITHUB_SHA}"
          IMAGE_BASE="${{ secrets.ALIYUN_REGISTRY }}/${{ secrets.ALIYUN_NAMESPACE }}/${REPO_NAME}"
          IMAGE_SHA="${IMAGE_BASE}:${GITHUB_SHA}"
          IMAGE_LATEST="${IMAGE_BASE}:latest"

          docker tag "${LOCAL_IMAGE}" "${IMAGE_SHA}"
          docker tag "${LOCAL_IMAGE}" "${IMAGE_LATEST}"

          docker push "${IMAGE_SHA}"
          docker push "${IMAGE_LATEST}"
